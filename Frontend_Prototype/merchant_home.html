<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التاجر - نظام القسائم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <img src="logo.jpg" alt="TRAOF Logo" style="max-height: 50px;">
        </div>
        <ul class="nav-links">
            <li><a href="merchant_home.html" class="active"><i class="fas fa-home"></i> الرئيسية</a></li>
            <li><a href="pos.html" data-i18n="nav_pos"><i class="fas fa-cash-register"></i> نقطة البيع (POS)</a></li>
            <!-- Reports is shared, could be limited to merchant data later, for now we allow access -->
            <li><a href="reports.html" data-i18n="nav_reports"><i class="fas fa-chart-bar"></i> التقارير</a></li>
            <li><a href="support.html"><i class="fas fa-headset"></i> الدعم الفني</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header>
            <h1><i class="fas fa-store"></i> لوحة تحكم التاجر</h1>
            <div class="user-profile">
                <span>مرحباً، التاجر</span>
                <div class="avatar">ت</div>
            </div>
        </header>

        <!-- Stats Grid -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="icon"><i class="fas fa-exchange-alt"></i></div>
                <h3>عمليات اليوم</h3>
                <div class="value">15</div>
            </div>
            <div class="stat-card">
                <div class="icon"><i class="fas fa-coins"></i></div>
                <h3>مبيعات اليوم</h3>
                <div class="value">2,450 ريال</div>
            </div>
        </div>

        <!-- Quick Access -->
        <h2>الوصول السريع</h2>
        <div class="dashboard-grid">
            <div class="stat-card" style="cursor: pointer;" onclick="window.location.href='pos.html'">
                <div class="icon"><i class="fas fa-cash-register"></i></div>
                <h3>فتح نقطة البيع</h3>
            </div>
            <div class="stat-card" style="cursor: pointer;" onclick="window.location.href='reports.html'">
                <div class="icon"><i class="fas fa-file-invoice"></i></div>
                <h3>عرض التقارير</h3>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
