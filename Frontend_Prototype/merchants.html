<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المتاجر - نظام القسائم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <img src="logo.jpg" alt="TRAOF Logo" style="max-height: 50px;">
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_dashboard"><i class="fas fa-home"></i> لوحة التحكم</a></li>
            <li><a href="cards.html" data-i18n="nav_cards"><i class="fas fa-credit-card"></i> البطاقات</a></li>
            <li><a href="wallets.html" data-i18n="nav_wallets"><i class="fas fa-wallet"></i> المحافظ</a></li>
            <li><a href="merchants.html" class="active" data-i18n="nav_merchants"><i class="fas fa-store"></i>
                    المتاجر</a></li>
            <li><a href="pos.html" data-i18n="nav_pos"><i class="fas fa-cash-register"></i> نقطة البيع (POS)</a></li>
            <li><a href="reports.html" data-i18n="nav_reports"><i class="fas fa-chart-bar"></i> التقارير</a></li>
            <li><a href="settings.html" data-i18n="nav_settings"><i class="fas fa-cog"></i> الإعدادات</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header>
            <h1 data-i18n="page_merchants_title"><i class="fas fa-store"></i> إدارة المتاجر</h1>
            <div class="user-profile">
                <div class="avatar">م</div>
            </div>
        </header>

        <div class="form-container">
            <h3>تسجيل متجر جديد</h3>
            <div class="form-group">
                <label>اسم المتجر</label>
                <input type="text" id="merchantNameInput" placeholder="الاسم التجاري">
            </div>
            <div class="form-group">
                <label>التصنيف</label>
                <select id="merchantCatInput">
                    <option value="مواد غذائية">مواد غذائية</option>
                    <option value="ملابس">ملابس</option>
                    <option value="طبي">طبي</option>
                    <option value="إلكترونيات">إلكترونيات</option>
                </select>
            </div>
            <div class="form-group">
                <label>مفتاح API (تلقائي)</label>
                <input type="text" value="KEY-29384-XKDW" readonly style="background: #eee;">
            </div>
            <button onclick="Actions.addMerchant()"><i class="fas fa-plus"></i> إضافة المتجر</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>المعرف</th>
                        <th>اسم المتجر</th>
                        <th>التصنيف</th>
                        <th>عمليات (اليوم)</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="merchantsTableBody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
