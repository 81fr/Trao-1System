<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - نظام القسائم</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all-svg.css">
    <style>
        .settings-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .settings-section h3 {
            margin-top: 0;
            border-bottom: 2px solid var(--light-bg);
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .two-col-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .list-group {
            list-style: none;
            padding: 0;
        }

        .list-group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .list-group-item:last-child {
            border-bottom: none;
        }

        .delete-btn {
            color: #e74c3c;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <img src="logo.jpg" alt="TRAOF Logo" style="max-height: 50px;">
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_dashboard"><i class="fas fa-home"></i> لوحة التحكم</a></li>
            <li><a href="cards.html" data-i18n="nav_cards"><i class="fas fa-credit-card"></i> البطاقات</a></li>
            <li><a href="wallets.html" data-i18n="nav_wallets"><i class="fas fa-wallet"></i> المحافظ</a></li>
            <li><a href="merchants.html" data-i18n="nav_merchants"><i class="fas fa-store"></i> المتاجر</a></li>
            <li><a href="pos.html" data-i18n="nav_pos"><i class="fas fa-cash-register"></i> نقطة البيع (POS)</a></li>
            <li><a href="reports.html" data-i18n="nav_reports"><i class="fas fa-chart-bar"></i> التقارير</a></li>
            <li><a href="settings.html" class="active" data-i18n="nav_settings"><i class="fas fa-cog"></i> الإعدادات</a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <p>صنع في تراؤف</p>
            <img src="logo.jpg" alt="Traof Logo">
        </div>
    </nav>

    <main class="main-content">
        <header>
            <h1 data-i18n="page_settings_title"><i class="fas fa-cog"></i> الإعدادات</h1>
        </header>

        <!-- General Labels Settings -->
        <div class="settings-section">
            <h3><i class="fas fa-tags"></i> تسميات النظام</h3>
            <p style="color: #666; margin-bottom: 15px;">يمكنك تغيير المسميات الظاهرة في الموقع هنا.</p>
            <div class="two-col-grid">
                <div class="form-group">
                    <label>تسمية "البطاقات"</label>
                    <input type="text" id="label_cards" placeholder="البطاقات">
                </div>
                <div class="form-group">
                    <label>تسمية "المحافظ"</label>
                    <input type="text" id="label_wallets" placeholder="المحافظ">
                </div>
                <div class="form-group">
                    <label>تسمية "المتاجر"</label>
                    <input type="text" id="label_merchants" placeholder="المتاجر">
                </div>
                <div class="form-group">
                    <label>تسمية "المستفيدين"</label>
                    <input type="text" id="label_beneficiaries" placeholder="المستفيدين">
                </div>
            </div>
            <button onclick="Settings.saveLabels()"><i class="fas fa-save"></i> حفظ التسميات</button>
        </div>

        <!-- Wallet Categories Settings -->
        <div class="settings-section">
            <h3><i class="fas fa-layer-group"></i> تصنيفات المحافظ</h3>
            <div class="form-group">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="newCategoryInput" placeholder="اسم التصنيف الجديد (مثلاً: دعم سكني)">
                    <button class="secondary" onclick="Settings.addCategory()" style="width: auto;">إضافة</button>
                </div>
            </div>
            <h4>التصنيفات الحالية:</h4>
            <ul id="categoriesList" class="list-group">
                <!-- Populated by JS -->
            </ul>
        </div>

        <!-- Beneficiaries Settings -->
        <div class="settings-section">
            <h3><i class="fas fa-users"></i> إدارة المستفيدين</h3>
            <div class="two-col-grid">
                <div class="form-group">
                    <label>اسم المستفيد</label>
                    <input type="text" id="beneficiaryName" placeholder="الاسم الرباعي">
                </div>
                <div class="form-group">
                    <label>رقم الهوية / الجوال</label>
                    <input type="text" id="beneficiaryID" placeholder="رقم الهوية أو الجوال">
                </div>
            </div>
            <button class="secondary" onclick="Settings.addBeneficiary()"><i class="fas fa-user-plus"></i> إضافة
                مستفيد</button>

            <h4 style="margin-top: 20px;">قائمة المستفيدين:</h4>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>المعرف (ID)</th>
                            <th>عدد البطاقات</th>
                            <th>حذف</th>
                        </tr>
                    </thead>
                    <tbody id="beneficiariesTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>

</html>
