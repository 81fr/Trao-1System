<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Awesome Test</title>
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all-svg.css">
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }

        .icon-box {
            margin: 20px;
            font-size: 2rem;
            color: #333;
        }

        i {
            margin: 10px;
        }
    </style>
</head>

<body>
    <h1>Font Awesome Test Page</h1>

    <div class="icon-box">
        <h3>Sidebar Icons Check</h3>
        <p><i class="fas fa-home"></i> Home (Dashboard)</p>
        <p><i class="fas fa-credit-card"></i> Credit Card (Cards)</p>
        <p><i class="fas fa-wallet"></i> Wallet (Wallets)</p>
        <p><i class="fas fa-store"></i> Store (Merchants)</p>
        <p><i class="fas fa-cash-register"></i> Cash Register (POS)</p>
        <p><i class="fas fa-chart-bar"></i> Chart Bar (Reports)</p>
        <p><i class="fas fa-users-cog"></i> Users Cog (Users)</p>
        <p><i class="fas fa-cog"></i> Cog (Settings)</p>
        <p><i class="fas fa-headset"></i> Headset (Support)</p>
    </div>

    <div class="icon-box">
        <h3>Other Common Icons</h3>
        <p><i class="fas fa-user-plus"></i> User Plus</p>
        <p><i class="fas fa-plus"></i> Plus</p>
        <p><i class="fas fa-sign-out-alt"></i> Sign Out</p>
    </div>
</body>

</html>
